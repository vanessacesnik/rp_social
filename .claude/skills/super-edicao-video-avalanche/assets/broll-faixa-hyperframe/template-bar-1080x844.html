<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      html,body{margin:0;padding:0;width:1080px;height:844px;overflow:hidden;background:#07090d;font-family:"Helvetica Neue","Arial",sans-serif;-webkit-font-smoothing:antialiased;}
      #root{position:relative;width:1080px;height:844px;overflow:hidden;background:radial-gradient(120% 140% at 0% 0%, #11161f 0%, #07090d 62%);color:#f4f7fb;}
      .guides{position:absolute;inset:0;background-image:linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);background-size:120px 100%;opacity:.5;}
      .topline{position:absolute;top:0;left:0;height:8px;width:1080px;background:#19e08a;transform-origin:left center;transform:scaleX(0);box-shadow:0 0 24px #19e08a;}
      .kicker{position:absolute;top:64px;left:80px;display:flex;align-items:center;gap:20px;font-size:34px;font-weight:700;letter-spacing:6px;text-transform:uppercase;color:#19e08a;opacity:0;}
      .kicker .dot{width:18px;height:18px;border-radius:50%;background:#19e08a;box-shadow:0 0 20px #19e08a;}
      .headline{position:absolute;top:150px;left:80px;width:920px;margin:0;font-size:96px;line-height:1.0;font-weight:800;letter-spacing:-2px;text-transform:uppercase;color:#f4f7fb;opacity:0;}
      .headline b{color:#19e08a;font-weight:800;}
      .prog{position:absolute;left:80px;bottom:70px;width:920px;height:6px;background:rgba(255,255,255,.12);}
      .prog i{position:absolute;left:0;top:0;height:6px;width:920px;background:#19e08a;transform-origin:left center;transform:scaleX(0);display:block;}
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="__ID__" data-width="1080" data-height="844" data-start="0" data-duration="__DUR__">
      <section class="scene clip" data-start="0" data-duration="__DUR__" data-track-index="1" style="position:absolute;inset:0">
        <div class="guides"></div>
        <div class="topline"></div>
        <div class="kicker"><span class="dot"></span>__KICKER__</div>
        <h1 class="headline">__TEXT__</h1>
        <div class="prog"><i></i></div>
      </section>
      <script>
        window.__timelines=window.__timelines||{};
        var tl=gsap.timeline({paused:true});
        tl.fromTo(".topline",{scaleX:0},{scaleX:1,duration:.6,ease:"power3.out"},0);
        tl.fromTo(".kicker",{opacity:0,x:-30},{opacity:1,x:0,duration:.5,ease:"power2.out"},.15);
        tl.fromTo(".headline",{opacity:0,y:40},{opacity:1,y:0,duration:.7,ease:"power3.out"},.35);
        tl.fromTo(".prog i",{scaleX:0},{scaleX:1,duration:(__DUR__-0.6),ease:"none"},.4);
        window.__timelines["__ID__"]=tl;
      </script>
    </div>
  </body>
</html>
